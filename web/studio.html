<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Tu selección personal de running y tus consultas guardadas en TRAZVA."
    />
    <title>Mi estudio — TRAZVA</title>
    <link rel="icon" href="assets/favicon.svg" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body data-page="studio">
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <header id="header"></header>
    <main id="contenido" class="wrap studio-main">
      <div class="studio-heading">
        <div>
          <p class="eyebrow">TU ESPACIO / TRAZVA</p>
          <h1>Mi rotación<span class="accent-dot">.</span></h1>
          <p>Los pares que te mueven, guardados en tu cuenta.</p>
        </div>
        <span class="studio-count" id="studioCount">—</span>
      </div>
      <div class="studio-tools">
        <a class="text-link" href="showroom.html?category=Running"
          >+ Descubrir más pares</a
        ><button class="text-link" id="exportStudio" disabled>
          Exportar mi selección ↓
        </button>
      </div>
      <section id="studioContent" aria-live="polite">
        <p>Cargando tu estudio…</p>
      </section>
      <section class="studio-requests" id="consultas">
        <div class="section-top">
          <div>
            <p class="eyebrow">TUS NOTAS Y PREGUNTAS</p>
            <h2>Consultas guardadas.</h2>
          </div>
          <a href="contact.html" class="text-link">Crear consulta ↗</a>
        </div>
        <p>
          Se guardan en tu espacio privado. No se envían por correo ni confirman
          un pedido.
        </p>
        <div id="requestList"></div>
      </section>
    </main>
    <footer id="footer"></footer>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
